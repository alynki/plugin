# The issue-link required check, as a COPY for this public repository
# (alynki/alynki#1208). GitHub does not let a public repository call a
# reusable workflow held in a private one, so plugin cannot `uses:`
# alynki/github-infrastructure's issue-link.yml as the other 13 repositories
# do. Everything from `jobs:` down is kept byte-identical to
# alynki/github-infrastructure .github/workflows/issue-link.yml; that
# repository's plan and drift jobs fail when the two differ
# (scripts/check-plugin-issue-link.sh). Change the source there first, then
# mirror it here.
#
# This repository is public. A pull request from a fork gets a read-only
# GITHUB_TOKEN and no OIDC token (GitHub enforces this, whatever the workflow
# requests), so the App-token mint fails and the check fails closed for fork
# PRs. No fork code is checked out or run: the job only reads PR metadata.
name: issue-link

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write

jobs:
  issue-link:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    env:
      # Whether the release-branch flow is in force (alynki/alynki#1611;
      # release-branch-flow.md §9.1 F15: wave 1 is built under today's rules
      # until the first ruleset apply, alynki/alynki#1616). "false" keeps
      # today's rules for a PR into main from a branch that is not work/** or
      # release/** (and keeps the dependabot/** and typed-client/** exemptions,
      # which the server's typed-client workflow still needs). The ruleset-apply
      # task sets it to "true"; a PR into release/** is judged by the flow's
      # rules either way. This env sits under `jobs:` so the plugin copy
      # mirrors it.
      FLOW_IN_FORCE: "false"
    steps:
      # Checked before any credential step, by branch name AND the bot that
      # opened the PR (a name alone could be spoofed by anyone who can push a
      # branch): dependabot/** from dependabot[bot], typed-client/** from the
      # alynki-ci App, and only until the flow is in force. An exempt PR mints
      # nothing and passes immediately.
      - name: Exempt Dependabot and typed-client PRs until the flow is in force (branch and author)
        id: exempt
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$FLOW_IN_FORCE:$BRANCH:$AUTHOR" in
            "false:dependabot/"*":dependabot[bot]"|"false:typed-client/"*":alynki-ci[bot]") exempt=true ;;
            *) exempt=false ;;
          esac
          echo "exempt=$exempt" >> "$GITHUB_OUTPUT"

      - name: Pass — exempt
        if: steps.exempt.outputs.exempt == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "issue-link: pass — $BRANCH, opened by $AUTHOR, is exempt"

      # The fixtures-token pattern server's ci.yaml uses on main
      # (alynki/alynki#1207; design docs/architecture/github-as-code.md §3):
      # a WIF-minted, narrowed alynki-ci-read App token, read-only, scoped to
      # exactly what this check needs — alynki/alynki, issues: read — and
      # never a value this job could leak into another repository's PR.
      - id: ci-read-auth
        if: steps.exempt.outputs.exempt != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1049459919093/locations/global/workloadIdentityPools/github/providers/github-ci
          service_account: alynki-ci-read@alynki-prod.iam.gserviceaccount.com

      # The App's private key, fetched with this job's own GCP identity;
      # masked the moment it is read.
      - id: ci-read-key
        if: steps.exempt.outputs.exempt != 'true'
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            private_key:alynki-prod/github-app-alynki-ci-read-key

      # Narrowed to exactly what resolving a reference in alynki/alynki needs.
      - id: ci-read-token
        if: steps.exempt.outputs.exempt != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23litAawoEYJsg5kgN # alynki-ci-read (App ID 5107709)
          private-key: ${{ steps.ci-read-key.outputs.private_key }}
          owner: alynki
          repositories: alynki
          permission-issues: read

      # google-github-actions/auth exports GOOGLE_APPLICATION_CREDENTIALS and
      # the CLOUDSDK_*/GCLOUD_*/GCP_*/GOOGLE_CLOUD_PROJECT variables job-wide
      # (GITHUB_ENV) — cleared here, once the mint above is done, the same
      # trap server's ci.yaml documents (alynki/alynki#1207).
      - name: Clear the ambient GCP credentials before the check runs
        if: steps.exempt.outputs.exempt != 'true'
        run: |
          {
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "CLOUDSDK_CORE_PROJECT="
            echo "GCLOUD_PROJECT="
            echo "GCP_PROJECT="
            echo "GOOGLE_CLOUD_PROJECT="
          } >> "$GITHUB_ENV"

      # Untrusted text (the branch names, the PR title and body) reaches the
      # script only through env:, never interpolated into this run: block —
      # GitHub's security-hardening guide's "preferred approach to handling
      # untrusted input". The commit messages are fetched by the script itself,
      # inside the process, from the paginated Pulls API — never placed in
      # `${{ }}` at all. The run: block is the INLINED part of
      # scripts/issue-link.sh, byte for byte (scripts/issue-link-proof/run.sh
      # fails when the two differ).
      - name: issue-link check
        if: steps.exempt.outputs.exempt != 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          OWN_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          ALYNKI_TOKEN: ${{ steps.ci-read-token.outputs.token }}
        run: |
          set -euo pipefail

          fail=0
          err() { echo "::error title=issue-link::$1"; fail=1; }

          # ---- resolution ----
          # gh_issue_json REPO NUM TOKEN -> prints the issue's JSON, 0 iff REPO#NUM exists
          # and is an issue, not a PR. The Issues API returns pull requests too; the
          # `pull_request` field is how the API tells the two apart (a PR number is not an
          # issue).
          gh_issue_json() {
            local repo="$1" num="$2" token="$3" out
            [ -n "$token" ] || return 1
            out=$(GH_TOKEN="$token" gh api "repos/$repo/issues/$num" 2>/dev/null) || return 1
            if printf '%s' "$out" | jq -e 'has("pull_request")' >/dev/null 2>&1; then return 1; fi
            printf '%s' "$out"
          }
          gh_issue() { gh_issue_json "$1" "$2" "$3" >/dev/null; }

          # token_for REPO -> the token this job holds for REPO: OWN_REPO (GITHUB_TOKEN) or
          # alynki/alynki (the narrowed ALYNKI_TOKEN); nothing for any other repository.
          token_for() {
            case "$1" in
              "$OWN_REPO")     printf '%s' "$GITHUB_TOKEN" ;;
              "alynki/alynki") printf '%s' "${ALYNKI_TOKEN:-}" ;;
              *)               printf '' ;;
            esac
          }

          # locate_issue NUM -> prints the repository NUM is an issue in: OWN_REPO first
          # (with GITHUB_TOKEN), then alynki/alynki (with the narrowed ALYNKI_TOKEN).
          locate_issue() {
            local num="$1"
            if gh_issue "$OWN_REPO" "$num" "$GITHUB_TOKEN"; then echo "$OWN_REPO"; return 0; fi
            if gh_issue "alynki/alynki" "$num" "${ALYNKI_TOKEN:-}"; then echo "alynki/alynki"; return 0; fi
            return 1
          }

          # resolve_bare NUM -> 0 iff NUM names an existing issue (see locate_issue).
          resolve_bare() { locate_issue "$1" >/dev/null; }

          # resolve_scoped REPO NUM -> 0 iff REPO#NUM resolves with a token this job
          # holds. Only OWN_REPO and alynki/alynki are reachable; a reference naming any
          # other repository cannot resolve here.
          resolve_scoped() {
            local repo="$1" num="$2"
            gh_issue "$repo" "$num" "$(token_for "$repo")"
          }

          # extract_refs TEXT -> one reference per line: "owner/repo#N" or "#N".
          # Scoped matches first, then bare "#N" on the text with every scoped match
          # blanked out first, so a scoped reference's own number is never double
          # counted as a second, bare reference.
          extract_refs() {
            local text="$1" scoped stripped bare
            scoped=$(printf '%s' "$text" | grep -oE '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+' || true)
            stripped=$(printf '%s' "$text" | sed -E 's|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+||g')
            # A bare #N counts only at the start or after a non-word character, so
            # abc#12 is not a reference to #12.
            bare=$(printf '%s' "$stripped" | grep -oE '(^|[^A-Za-z0-9_])#[0-9]+' | grep -oE '#[0-9]+' || true)
            { [ -n "$scoped" ] && printf '%s\n' "$scoped"; [ -n "$bare" ] && printf '%s\n' "$bare"; } || true
          }

          # resolves_any TEXT -> 0 iff at least one reference in TEXT resolves.
          resolves_any() {
            local text="$1" ref repo num
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              if [[ "$ref" == */*#* ]]; then
                repo="${ref%#*}"; num="${ref##*#}"
                resolve_scoped "$repo" "$num" && return 0
              else
                num="${ref#\#}"
                resolve_bare "$num" && return 0
              fi
            done <<<"$(extract_refs "$text")"
            return 1
          }

          # names_issue TEXT -> 0 iff TEXT names an existing issue (today's title/commit rule).
          names_issue() { [ -n "$(extract_refs "$1")" ] && resolves_any "$1"; }

          # carries_refs TEXT -> 0 iff the word Refs is followed, on its line, by a reference
          # to an existing issue ("Refs alynki/alynki#1611", "Refs: #42, #43").
          carries_refs() {
            local rest
            rest=$(printf '%s\n' "$1" | grep -oiE '(^|[^A-Za-z0-9_])refs:?[[:space:]]+.*' || true)
            [ -n "$rest" ] && resolves_any "$rest"
          }

          # uses_closes TEXT -> 0 iff TEXT closes something: a closing keyword (close, closes,
          # closed, fix, fixes, fixed, resolve, resolves, resolved; any case, an optional colon)
          # followed by an issue reference: #N, owner/repo#N, GH-N or an issue URL.
          uses_closes() {
            printf '%s\n' "$1" | grep -qiE '(^|[^A-Za-z0-9_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+(([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+|GH-[0-9]+|https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+)'
          }

          # ---- the sub-issue and label rules ----
          # issue_has_label REPO NUM LABEL... -> 0 iff the issue carries one of the labels.
          issue_has_label() {
            local repo="$1" num="$2" json l
            shift 2
            json=$(gh_issue_json "$repo" "$num" "$(token_for "$repo")") || return 1
            for l in "$@"; do
              if jq -e --arg l "$l" '[.labels[]?.name] | index($l) != null' <<<"$json" >/dev/null; then return 0; fi
            done
            return 1
          }

          # pr_has_label LABEL -> 0 iff THIS pull request carries the label, read live from
          # the API (the Issues API serves a PR's labels too).
          pr_has_label() {
            local out
            out=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$OWN_REPO/issues/$PR_NUMBER" 2>/dev/null) || return 1
            jq -e --arg l "$1" '[.labels[]?.name] | index($l) != null' <<<"$out" >/dev/null
          }

          # issue_parent REPO NUM -> prints "owner/repo number" of the issue's parent; 1 if none.
          issue_parent() {
            local repo="$1" num="$2" token out
            token=$(token_for "$repo")
            [ -n "$token" ] || return 1
            out=$(GH_TOKEN="$token" gh api "repos/$repo/issues/$num/parent" 2>/dev/null) || return 1
            jq -r '"\(.repository_url | sub("^.*/repos/"; "")) \(.number)"' <<<"$out"
          }

          # descends_from WREPO W FREPO F -> 0 iff W is a sub-issue of F, nested allowed
          # (a sub-issue of a sub-issue of F counts), at most 10 levels up.
          descends_from() {
            local repo="$1" num="$2" frepo="$3" f="$4" depth=0 p
            while [ "$depth" -lt 10 ]; do
              p=$(issue_parent "$repo" "$num") || return 1
              repo="${p% *}"; num="${p##* }"
              if [ "$repo" = "$frepo" ] && [ "$num" = "$f" ]; then return 0; fi
              depth=$((depth + 1))
            done
            return 1
          }

          # ---- commits ----
          # Fetched once. The count of commits seen and checked is what makes the check fail
          # closed: a PR always has a commit, so none means the listing failed. The PR's own
          # commit count and head repository come from the Pulls API (pr_info).
          commits_json=$(GH_TOKEN="$GITHUB_TOKEN" gh api --paginate "repos/$OWN_REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | {sha, message: .commit.message, parents: [.parents[].sha]}' | jq -s -c '.[]')
          pr_info=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$OWN_REPO/pulls/$PR_NUMBER" \
            --jq '"\(.commits) \(.head.repo.full_name // "")"' 2>/dev/null) || pr_info=""
          pr_commit_count="${pr_info%% *}"
          pr_head_repo="${pr_info#* }"

          # is_base_ancestor SHA -> 0 iff SHA is an ancestor of the base branch (compare says the
          # base is ahead of it, or the same). The base is only ever main or a validated release
          # branch here; nothing else reaches the API path.
          is_base_ancestor() {
            local status
            [[ "$BASE" =~ ^(main|release/[0-9]+-[a-z0-9-]+)$ ]] || return 1
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] || return 1
            status=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$OWN_REPO/compare/$BASE...$1" --jq .status 2>/dev/null) || return 1
            [ "$status" = behind ] || [ "$status" = identical ]
          }

          # skippable_merge COMMIT_JSON LISTED_SHAS -> 0 iff the merge commit is what "update
          # branch" or `git merge main` makes: exactly two parents, one an ancestor of the base
          # (the base branch's side), the other either in the PR's own history (the listed
          # commits) or itself an ancestor of the base (a branch that has only just left it).
          skippable_merge() {
            local c="$1" listed="$2" n a b
            n=$(jq -r '.parents | length' <<<"$c")
            [ "$n" -eq 2 ] || return 1
            a=$(jq -r '.parents[0]' <<<"$c")
            b=$(jq -r '.parents[1]' <<<"$c")
            if is_base_ancestor "$b" && { grep -qxF "$a" <<<"$listed" || is_base_ancestor "$a"; }; then return 0; fi
            if is_base_ancestor "$a" && { grep -qxF "$b" <<<"$listed" || is_base_ancestor "$b"; }; then return 0; fi
            return 1
          }

          # check_commits RULE -> RULE is `names` (today: a commit names an existing issue) or
          # `refs` (the flow: a non-merge commit carries Refs to one, and no commit closes).
          # Under `names` a merge commit (two or more parents) is skipped: "Update branch" writes
          # "Merge branch 'main' into …", which names no issue, and a squash merge drops it
          # anyway. Under `refs` only a skippable_merge is skipped, any other merge is a failure,
          # and the listing must be complete (equal to the PR's commit count, at most 250).
          check_commits() {
            local rule="$1" c sha msg seen=0 checked=0 listed bad=() closing=() badmerge=()
            listed=$(jq -r '.sha' <<<"$commits_json")
            while IFS= read -r c; do
              [ -n "$c" ] || continue
              seen=$((seen + 1))
              sha=$(jq -r '.sha' <<<"$c")
              msg=$(jq -r '.message' <<<"$c")
              if [ "$rule" = refs ] && uses_closes "$msg"; then closing+=("${sha:0:7}"); fi
              if [ "$(jq -r '.parents | length' <<<"$c")" -gt 1 ]; then
                if [ "$rule" = refs ] && ! skippable_merge "$c" "$listed"; then badmerge+=("${sha:0:7}"); fi
                continue
              fi
              checked=$((checked + 1))
              if [ "$rule" = refs ]; then
                carries_refs "$msg" || bad+=("${sha:0:7}")
              else
                names_issue "$msg" || bad+=("${sha:0:7}")
              fi
            done <<<"$commits_json"
            # Fail closed: a PR always has a commit, so none means the listing failed.
            [ "$seen" -gt 0 ] || err "the PR's commit list came back empty; refusing to pass"
            # A PR of merge commits only would pass vacuously: at least one commit must be checked.
            [ "$seen" -eq 0 ] || [ "$checked" -gt 0 ] || err "every commit is a merge commit; at least one must reference an issue"
            if [ "$rule" = refs ]; then
              if ! [[ "$pr_commit_count" =~ ^[0-9]+$ ]]; then
                err "the PR's commit count could not be read; refusing to pass on a commit list that cannot be checked for completeness"
              elif [ "$pr_commit_count" -gt 250 ]; then
                err "the PR has $pr_commit_count commits and the commit listing stops at 250, so the commits cannot all be checked — split the release"
              elif [ "$seen" -ne "$pr_commit_count" ]; then
                err "the commit listing has $seen commits but the PR has $pr_commit_count — the list is incomplete, refusing to pass"
              fi
            fi
            if [ "${#bad[@]}" -gt 0 ]; then
              if [ "$rule" = refs ]; then
                err "commit(s) carry no Refs to an existing issue: ${bad[*]} — end the commit message with 'Refs owner/repo#N'"
              else
                err "commit(s) name no existing issue: ${bad[*]}"
              fi
            fi
            if [ "${#badmerge[@]}" -gt 0 ]; then
              err "merge commit(s) ${badmerge[*]} are not an update from the base branch (exactly two parents: the base's history and the branch's) — merge only $BASE into the branch, nothing else"
            fi
            if [ "${#closing[@]}" -gt 0 ]; then
              err "commit(s) use a closing keyword: ${closing[*]} — no PR closes anything, write 'Refs' instead; the close-out step closes the issues"
            fi
          }

          # ---- today's rules ----
          legacy_check() {
            local branch_num
            # 1. branch name
            if [[ ! "$BRANCH" =~ ^([0-9]+)-[a-z0-9-]+$ ]]; then
              err "branch '$BRANCH' is not {issueNumber}-{slug} — rename the branch to issue-slug"
            else
              branch_num="${BASH_REMATCH[1]}"
              if ! resolve_bare "$branch_num"; then
                err "branch '$BRANCH' names issue #$branch_num, which does not resolve to an existing issue in $OWN_REPO or alynki/alynki"
              fi
            fi
            # 2. PR title
            if ! names_issue "$TITLE"; then
              err "PR title '$TITLE' names no existing issue — name the issue in the title"
            fi
            # 3. every commit
            check_commits names
            if [ "$fail" -eq 0 ]; then
              echo "issue-link: pass — branch, title and every commit reference an existing issue"
            fi
          }

          # ---- the release-branch flow ----
          # feature_ok NUM -> 0 iff NUM is an existing issue carrying the release label (or
          # recovers, a recovery run's feature); on 1 it has printed the reason as an error.
          feature_ok() {
            local f="$1" frepo
            if ! frepo=$(locate_issue "$f"); then
              err "release branch names #$f, which does not resolve to an existing issue in $OWN_REPO or alynki/alynki — name the feature in the branch: release/{feature#}-{slug}"
              return 1
            fi
            if ! issue_has_label "$frepo" "$f" release recovers; then
              err "#$f does not carry the 'release' label — add the label release to the feature #$f (the run's first step does), or target the release branch of the feature that has it"
              return 1
            fi
            return 0
          }

          # image_pin_ok -> 0 iff this PR changes exactly cloudrun.tf, and in it only the
          # @sha256: digests (every removed line has an added twin that differs from it by a
          # digest alone, so an image name, a flag or another line changing fails), and its head
          # is a branch of this repository, not a fork's. On 1 it has printed each reason as an
          # error.
          image_pin_ok() {
            local files n patch removed added
            if [ "$pr_head_repo" != "$OWN_REPO" ]; then
              err "an image-pin PR must come from a branch of $OWN_REPO, not a fork — push the work/{issue#}-pin-… branch to $OWN_REPO"
              return 1
            fi
            files=$(GH_TOKEN="$GITHUB_TOKEN" gh api --paginate "repos/$OWN_REPO/pulls/$PR_NUMBER/files" \
              --jq '.[] | {filename, patch: (.patch // "")}' 2>/dev/null | jq -s -c '.') || files=""
            if [ -z "$files" ]; then
              err "the files of the image-pin PR could not be read; refusing to pass"
              return 1
            fi
            n=$(jq 'length' <<<"$files")
            if [ "$n" -ne 1 ] || [ "$(jq -r '.[0].filename' <<<"$files")" != "cloudrun.tf" ]; then
              err "an image-pin PR must change exactly cloudrun.tf and nothing else, but this PR changes $n file(s) — put every other change in a work/ PR into a release branch"
              return 1
            fi
            patch=$(jq -r '.[0].patch' <<<"$files")
            if [ -z "$patch" ]; then
              err "cloudrun.tf has no patch to read (too large, or only renamed); an image-pin PR must be a few digest lines"
              return 1
            fi
            removed=$(printf '%s\n' "$patch" | grep -E '^-' | sed -E 's/^-//; s/@sha256:[0-9a-f]{64}/@sha256:DIGEST/' | LC_ALL=C sort || true)
            added=$(printf '%s\n' "$patch" | grep -E '^\+' | sed -E 's/^\+//; s/@sha256:[0-9a-f]{64}/@sha256:DIGEST/' | LC_ALL=C sort || true)
            if ! printf '%s\n%s\n' "$removed" "$added" | grep -q '@sha256:DIGEST'; then
              err "an image-pin PR must change @sha256: digest lines in cloudrun.tf, and this one changes none"
              return 1
            fi
            if [ "$removed" != "$added" ]; then
              err "an image-pin PR may change only the @sha256: digests in cloudrun.tf; another part of a changed line differs (an image name, a flag or another line) — move that change to a work/ PR"
              return 1
            fi
            return 0
          }

          flow_check() {
            local w f wrepo frepo
            # BRANCH and BASE are untrusted PR text. They reach this script only through env:, and
            # nothing is derived from them (an API path, a number) until they are known to be a
            # plain ref name; a name that is not one is refused WITHOUT being echoed.
            if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || ! [[ "$BASE" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]; then
              err "the head or base branch name has characters outside A-Z a-z 0-9 . _ / - ; a branch name must be work/{issue#}-{slug} (head) into release/{feature#}-{slug} or main"
              return 0
            fi
            if [ "$BASE" = "main" ]; then
              if [[ "$BRANCH" =~ ^release/([0-9]+)-[a-z0-9-]+$ ]]; then
                feature_ok "${BASH_REMATCH[1]}" || true
              elif [ "$OWN_REPO" = "alynki/gcp-infrastructure" ] && [[ "$BRANCH" =~ ^work/([0-9]+)-pin-[a-z0-9-]+$ ]] && pr_has_label image-pin; then
                # The one exception to "main only from release/**": an image-pin PR, narrowed
                # to a branch of this repository that changes nothing but cloudrun.tf digests.
                w="${BASH_REMATCH[1]}"
                resolve_bare "$w" || err "branch '$BRANCH' names issue #$w, which does not resolve to an existing issue in $OWN_REPO or alynki/alynki"
                image_pin_ok || true
              else
                err "a PR into main must come from release/{feature#}-{slug}, not '$BRANCH' — open the PR from the release branch of the feature (labelled release); only an image-pin PR on gcp-infrastructure from work/{issue#}-pin-… may go to main directly"
              fi
            else
              # BASE is release/**
              f=""
              if [[ "$BASE" =~ ^release/([0-9]+)-[a-z0-9-]+$ ]]; then
                f="${BASH_REMATCH[1]}"
              else
                err "release branch '$BASE' is not release/{feature#}-{slug} — name it after the feature (suffixes -fix, -post, -migrate, -services allowed)"
              fi
              w=""
              if [[ "$BRANCH" =~ ^work/([0-9]+)-[a-z0-9-]+$ ]]; then
                w="${BASH_REMATCH[1]}"
              else
                err "a PR into $BASE must come from work/{issue#}-{slug}, not '$BRANCH' — rename the branch to work/issue-slug"
              fi
              if [ -n "$f" ] && feature_ok "$f"; then
                if [ -n "$w" ]; then
                  if ! wrepo=$(locate_issue "$w"); then
                    err "branch '$BRANCH' names issue #$w, which does not resolve to an existing issue in $OWN_REPO or alynki/alynki"
                  else
                    frepo=$(locate_issue "$f")
                    descends_from "$wrepo" "$w" "$frepo" "$f" ||
                      err "issue #$w is not a sub-issue (nested allowed) of the feature #$f that $BASE names — add #$w as a sub-issue of #$f, or target the release branch of the feature it belongs to"
                  fi
                fi
              fi
            fi
            # Refs on the PR (title or body) and on every non-merge commit; no PR closes anything.
            carries_refs "$TITLE"$'\n'"${BODY:-}" || err "the PR carries no Refs to an existing issue — write 'Refs owner/repo#N' in the PR body"
            if uses_closes "$TITLE"$'\n'"${BODY:-}"; then
              err "the PR uses a closing keyword (Closes, Fixes, Resolves) — no PR closes anything, write 'Refs' instead; the close-out step closes the issues"
            fi
            check_commits refs
            if [ "$fail" -eq 0 ]; then
              echo "issue-link: pass — $BRANCH into $BASE, the release label, the sub-issue and Refs hold"
            fi
          }

          # ---- which rules ----
          # The flow judges a PR into release/**, and a PR into main when it is in force or
          # the PR already uses the flow's branches; anything else keeps today's rules.
          use_flow=false
          case "$BASE" in
            release/*) use_flow=true ;;
            main)
              if [ "$FLOW_IN_FORCE" = "true" ] || [[ "$BRANCH" =~ ^(work|release)/ ]]; then use_flow=true; fi
              ;;
          esac
          if [ "$use_flow" = "true" ]; then flow_check; else legacy_check; fi
          exit "$fail"
